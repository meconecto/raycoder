name: release candidate

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested RC to npm under the next tag
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 11.19.0
          runtime: node@24
          require-lockfile: true
      - run: pnpm security:check
      - name: Scan complete history with Gitleaks 8.30.1
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --no-banner
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Resolve immutable artifact paths
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/server/package.json').version")
          echo "RAYCODER_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RAYCODER_TAG=v${VERSION}" >> "$GITHUB_ENV"
          echo "RAYCODER_TARBALL=artifacts/raycoder-${VERSION}.tgz" >> "$GITHUB_ENV"
          echo "RAYCODER_CHECKSUM=artifacts/raycoder-${VERSION}.tgz.sha256" >> "$GITHUB_ENV"
      - run: pnpm release:artifact
      - run: pnpm package:smoke "${{ env.RAYCODER_TARBALL }}"
      - run: pnpm package:npx-smoke "${{ env.RAYCODER_TARBALL }}"
      - run: pnpm installer:smoke "${{ env.RAYCODER_TARBALL }}"
      - run: pnpm dogfood:v1 "${{ env.RAYCODER_TARBALL }}"
      - run: pnpm dogfood:rc4 "${{ env.RAYCODER_TARBALL }}"
      - run: pnpm dogfood:preparation "${{ env.RAYCODER_TARBALL }}"
      - run: pnpm dogfood:verification "${{ env.RAYCODER_TARBALL }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raycoder-release-candidate
          path: |
            ${{ env.RAYCODER_TARBALL }}
            ${{ env.RAYCODER_CHECKSUM }}
          if-no-files-found: error
      - if: ${{ inputs.publish }}
        run: pnpm release:publish:rc
      - if: ${{ inputs.publish }}
        name: Create GitHub Release from the published artifact
        shell: bash
        run: gh release create "$RAYCODER_TAG" "$RAYCODER_TARBALL" "$RAYCODER_CHECKSUM" --verify-tag --prerelease --title "raycoder $RAYCODER_VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
